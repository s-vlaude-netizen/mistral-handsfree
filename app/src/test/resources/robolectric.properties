# Run the screens as Android 15, the version the app targets.
sdk=35

# A Pixel-sized screen. Robolectric's default is 320x470, on which the sign-in form
# scrolls and its buttons end up outside the window.
qualifiers=w411dp-h891dp-xxhdpi

# Needed to take screenshots of Compose content in Robolectric's native graphics mode.
robolectric.pixelCopyRenderMode=hardware
