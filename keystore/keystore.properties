# Signing key of this project - deliberately part of the repo.
#
# Why: CI builds a new APK on every push. Without a fixed key each run would
# sign with a different auto-generated debug key, and Android refuses to install
# the result over the previous version. You would have to uninstall every time
# and lose your settings and your stored Mistral key.
#
# The price: anyone who can read this file can build an APK that devices accept
# as an update of this app - that is, anyone who can read the repo. See the
# "Signing" section of the README, including how to use your own private key
# (SIGNING_* environment variables / GitHub secrets) instead of this one.
storeFile=keystore/handsfree.jks
storePassword=handsfree
keyAlias=handsfree
keyPassword=handsfree
